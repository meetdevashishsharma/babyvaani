<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Vaani Monitor</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        /* Global CSS Reset & Layout */
        *, *::before, *::after { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; color: #ffffff; font-family: -apple-system, sans-serif; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Screens */
        .screen { display: flex; flex-direction: column; width: 100%; height: 100%; position: absolute; top: 0; left: 0; align-items: center; justify-content: center; }
        #homeScreen { padding: 20px; overflow-y: auto; }
        
        /* Typography & UI */
        h1 { font-size: 24px; margin-bottom: 10px; text-align: center; }
        p { font-size: 14px; color: #aaaaaa; text-align: center; margin-bottom: 20px; }
        .btn { padding: 15px 20px; margin: 10px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 90%; max-width: 350px; text-align: center; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-dark { background: #333; color: white; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        
        /* Inputs & Forms */
        input[type="text"] { width: 90%; max-width: 350px; padding: 15px; font-size: 20px; text-align: center; letter-spacing: 5px; border-radius: 8px; border: 2px solid #444; background: #222; color: white; margin-bottom: 15px; text-transform: uppercase; }
        .form-group { width: 90%; max-width: 350px; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
        .form-group select { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 5px; font-size: 14px; }
        .warning-banner { background: #ffcc00; color: #000; padding: 8px; border-radius: 5px; font-size: 12px; margin-bottom: 10px; font-weight: bold; text-align: center; }
        
        /* Video Viewport */
        .video-container { width: 100%; height: 100%; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; transform: translateZ(0); }
        .baby-locked { pointer-events: none; }
        .baby-locked::-webkit-media-controls { display: none !important; }
        .baby-locked::-webkit-media-controls-enclosure { display: none !important; }
        
        /* Parent UI Overlays */
        .top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.6); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 10; }
        .cctv-time { position: absolute; bottom: 12%; left: 15px; color: #ff3b30; font-family: monospace; font-size: 14px; font-weight: bold; z-index: 999; text-shadow: 1px 1px 2px black; }
        canvas#audioVisualizer { position: absolute; bottom: 12%; right: 15px; width: 100px; height: 40px; z-index: 999; pointer-events: none; }
        
        /* Fullscreen Streaming Controls */
        .parent-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 10vh; max-height: 80px; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: space-around; padding: 0 10px; z-index: 20; }
        .ctrl-btn { background: none; border: none; color: white; font-size: 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .ctrl-btn span { font-size: 20px; margin-bottom: 4px; }
        .ctrl-btn:disabled { opacity: 0.4; pointer-events: none; }
        .slider-container { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .slider-container label { font-size: 10px; margin-bottom: 2px; }
        input[type="range"] { width: 100%; }
        
        /* Battery & OLED Dimmer */
        #dimOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; opacity: 1; display: none; }
        #disconnectOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; }
        
        /* Utilities */
        .night-mode { filter: brightness(1.4) contrast(1.1); }
        .signal-bar { display: inline-block; width: 4px; height: 12px; background: #555; margin-left: 2px; border-radius: 2px; }
        .signal-good { background: #34c759; }
        .signal-ok { background: #ffcc00; }
        .signal-poor { background: #ff3b30; }
    </style>
</head>
<body>

    <div id="homeScreen" class="screen">
        <h1>Baby Vaani</h1>
        <p>Turn any device into a secure baby monitor.</p>
        
        <div class="form-group">
            <div class="warning-banner">Warning: Choose the exact same mode as the baby cam!</div>
            <label>Connection Speed Mode</label>
            <select id="networkMode">
                <option value="internet">Internet (Works Anywhere)</option>
                <option value="lan">Local Wi-Fi (Faster, Same Network Only)</option>
            </select>
            
            <label style="margin-top:10px;">Multiple Viewers</label>
            <select id="viewerMode">
                <option value="multi">Allow Multiple Viewers</option>
                <option value="single">Single Viewer Only (Max Security)</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="initBabyCamera()">Start Baby Camera</button>
        
        <div style="width: 90%; max-width: 350px; margin: 20px 0; border-top: 1px solid #444; padding-top: 20px;">
            <label style="font-size: 14px; font-weight: bold; margin-bottom: 10px; display: block; text-align: center;">Connect as Parent</label>
            <input type="text" id="joinRoomCode" placeholder="ENTER 6-DIGIT CODE" maxlength="6">
            <button id="connectBtn" class="btn btn-primary" style="width: 100%; margin: 0;" onclick="joinAsParent()">Connect to Monitor</button>
        </div>
        
        <button class="btn btn-dark" style="margin-top: 30px; font-size: 12px;" onclick="clearData()">Clear all app data & reset</button>
    </div>

    <div id="babyScreen" class="screen hidden">
        <div class="video-container">
            <video id="babyRawVideo" class="hidden" autoplay playsinline muted></video>
            <canvas id="babyProxyCanvas" class="hidden"></canvas>
            <video id="babyDisplayVideo" class="baby-locked" autoplay playsinline muted></video>
            
            <div style="position: absolute; top: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; text-align: center; z-index: 10;">
                <h3 style="margin: 0 0 10px 0;">Room Code</h3>
                <h1 id="displayRoomCode" style="font-size: 36px; letter-spacing: 5px; margin: 0; color: #34c759;">L O A D I N G . . .</h1>
                <p style="margin: 10px 0 0 0; font-size: 12px;">Keep this window open. Do not lock device.</p>
            </div>
            
            <button class="btn btn-dark" style="position: absolute; bottom: 20px; z-index: 10;" onclick="dimBabyScreen()">Baby Screen Off</button>
        </div>
        
        <div id="dimOverlay" onclick="wakeBabyScreen()"></div>
        
        <audio id="audio-slot-1" autoplay playsinline style="opacity:0; position:absolute; pointer-events:none;"></audio>
        <audio id="audio-slot-2" autoplay playsinline style="opacity:0; position:absolute; pointer-events:none;"></audio>
        <audio id="audio-slot-3" autoplay playsinline style="opacity:0; position:absolute; pointer-events:none;"></audio>
    </div>

    <div id="parentScreen" class="screen hidden">
        <div class="top-bar">
            <span id="batteryStatus" style="font-size: 12px;">Baby: --%</span>
            <div style="font-size: 12px; display: flex; align-items: center;">
                Code: <span id="parentCodeDisplay" style="margin: 0 5px;">••••••</span> 
                <button onclick="toggleCodeMask()" style="background:none;border:none;color:white;cursor:pointer;">👁️</button>
            </div>
            <div id="signalStrength" style="display:flex; align-items:flex-end; height:12px;">
                <div class="signal-bar signal-good"></div>
                <div class="signal-bar signal-good"></div>
                <div class="signal-bar signal-good"></div>
            </div>
        </div>

        <div class="video-container">
            <video id="parentVideo" autoplay playsinline></video>
            <div class="cctv-time" id="cctvClock">LIVE 🟢 --:--:--</div>
            <canvas id="audioVisualizer"></canvas>
        </div>
        
        <div class="parent-controls">
            <button class="ctrl-btn" onclick="toggleMute()">
                <span id="muteIcon">🔇</span>Mute
            </button>
            <div class="slider-container">
                <label>Audio Boost</label>
                <input type="range" id="volSlider" min="1" max="4" step="0.1" value="1" disabled style="opacity: 0.5;">
            </div>
            <button class="ctrl-btn" id="talkBtn">
                <span>🎤</span>Talk
            </button>
            <button class="ctrl-btn" onclick="toggleNightMode()">
                <span>🌙</span>Night
            </button>
            <div class="slider-container">
                <label>Quality</label>
                <select id="qualitySelect" style="width: 100%; font-size:10px; background:#333; color:white; border:none;" onchange="changeQuality()">
                    <option value="balanced">720p</option>
                    <option value="fast">360p</option>
                    <option value="ultra">144p</option>
                </select>
            </div>
            <button class="ctrl-btn" id="flipBtn" onclick="remoteFlipCam()">
                <span>🔄</span>Flip
            </button>
            <button class="ctrl-btn" onclick="endSession()" style="color: #ff3b30;">
                <span>✖️</span>End
            </button>
        </div>
    </div>
    
    <div id="disconnectOverlay">
        <h2 style="color: white;">Stream Disconnected</h2>
        <p style="color: #aaa;">The connection to the baby monitor was lost.</p>
        <button class="btn btn-primary" onclick="endSession()">Go to Home</button>
    </div>

    <script>
        // ES5 COMPATIBLE JAVASCRIPT ENGINE (PHASE 4 STABILIZED)
        
        var peer = null;
        var activeConnections = [];
        var activeCalls = [];
        var isBabyMode = false;
        var currentCameraFacingMode = "environment"; 
        var isSwitchingCamera = false; // Concurrency lock on baby device
        var isParentControlLocked = false; // Cooldown lock on parent device
        
        var proxyCanvas = document.getElementById('babyProxyCanvas');
        var proxyContext = proxyCanvas.getContext('2d');
        var hiddenVideo = document.getElementById('babyRawVideo');
        var isCanvasActive = false;
        var lastDrawTime = 0;
        var currentFpsInterval = 1000 / 15; // Hard-throttled to 15fps max
        
        var parentAudioCtx = null;
        var parentGainNode = null;
        var analyserNode = null;
        var isMuted = true;
        var heartbeatInterval = null;

        function showScreen(screenId) {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('babyScreen').classList.add('hidden');
            document.getElementById('parentScreen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function generateRoomCode() {
            var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; 
            var code = '';
            for (var i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function triggerDisconnect() {
            document.getElementById('disconnectOverlay').style.display = 'flex';
        }

        // Aggressive Memory Cleanup & Zombie Track Removal
        function cleanupOldStream() {
            if (hiddenVideo.srcObject) {
                var tracks = hiddenVideo.srcObject.getTracks();
                for (var i = 0; i < tracks.length; i++) {
                    tracks[i].stop();
                }
                hiddenVideo.srcObject = null;
            }
            if (proxyContext) {
                proxyContext.clearRect(0, 0, proxyCanvas.width, proxyCanvas.height);
            }
        }

        // Hard-Throttled Draw Loop (Decoupled from 60fps to save RAM & CPU)
        function drawCanvas() {
            if (!isCanvasActive) return;
            requestAnimationFrame(drawCanvas);
            
            var now = Date.now();
            var elapsed = now - lastDrawTime;
            
            if (elapsed > currentFpsInterval) {
                lastDrawTime = now - (elapsed % currentFpsInterval);
                if (hiddenVideo.readyState >= 2) {
                    proxyContext.drawImage(hiddenVideo, 0, 0, proxyCanvas.width, proxyCanvas.height);
                }
            }
        }

        function initBabyCamera() {
            isBabyMode = true;
            var isSingleViewer = document.getElementById('viewerMode').value === 'single';
            var roomCode = generateRoomCode();
            document.getElementById('displayRoomCode').innerText = roomCode;
            
            document.getElementById('audio-slot-1').play().catch(function(){});
            document.getElementById('audio-slot-2').play().catch(function(){});
            document.getElementById('audio-slot-3').play().catch(function(){});

            showScreen('babyScreen');
            
            initPeerNetwork(roomCode, function() {
                startCameraHardware('balanced');
            });
            
            peer.on('connection', function(conn) {
                if (isSingleViewer && activeConnections.length >= 1) {
                    conn.on('open', function() {
                        conn.send({ type: 'ERROR', message: 'Room is full or locked.' });
                        setTimeout(function(){ conn.close(); }, 500);
                    });
                    return;
                }
                
                activeConnections.push(conn);
                conn.on('data', handleParentCommand);
                conn.on('close', function() {
                    activeConnections = activeConnections.filter(function(c) { return c !== conn; });
                });
            });
            
            peer.on('call', function(call) {
                if (isSingleViewer && activeCalls.length >= 1) {
                    call.close();
                    return;
                }
                
                var outStream = proxyCanvas.captureStream(15); 
                if (hiddenVideo.srcObject) {
                    var audioTracks = hiddenVideo.srcObject.getAudioTracks();
                    if (audioTracks.length > 0) outStream.addTrack(audioTracks[0]);
                }
                
                call.answer(outStream);
                activeCalls.push(call);
                
                call.on('stream', function(parentAudioStream) {
                    var slot = document.getElementById('audio-slot-1');
                    slot.srcObject = parentAudioStream;
                    slot.play();
                });
                
                call.on('close', function() {
                    activeCalls = activeCalls.filter(function(c) { return c !== call; });
                });
            });
            
            startHeartbeat();
        }

        // Camera Hardware with Silent Auto-Recovery Failsafe
        function startCameraHardware(qualityStr, callback) {
            cleanupOldStream();
            
            var constraints = { audio: true, video: { facingMode: currentCameraFacingMode } };
            
            if (qualityStr === 'ultra') {
                proxyCanvas.width = 256; proxyCanvas.height = 144;
                currentFpsInterval = 1000 / 10; 
            } else if (qualityStr === 'fast') {
                proxyCanvas.width = 640; proxyCanvas.height = 360;
                currentFpsInterval = 1000 / 15; 
            } else {
                proxyCanvas.width = 1280; proxyCanvas.height = 720;
                currentFpsInterval = 1000 / 15; 
            }

            var timeout = setTimeout(function() {
                // Silent Auto-Recovery instead of blocking alert popup
                console.warn("Camera hardware timeout, attempting silent recovery...");
                setTimeout(function() {
                    startCameraHardware(qualityStr, callback);
                }, 2000);
            }, 8000);

            navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
                clearTimeout(timeout);
                hiddenVideo.srcObject = stream;
                document.getElementById('babyDisplayVideo').srcObject = stream; 
                
                hiddenVideo.onloadedmetadata = function() {
                    hiddenVideo.play();
                    isCanvasActive = true;
                    lastDrawTime = Date.now();
                    drawCanvas();
                    if (callback) callback();
                };
            }).catch(function(err) {
                clearTimeout(timeout);
                console.warn("Camera access failed, silent auto-retry in 2s: " + err.message);
                setTimeout(function() {
                    startCameraHardware(qualityStr, callback);
                }, 2000);
            });
        }

        function joinAsParent() {
            var code = document.getElementById('joinRoomCode').value.toUpperCase().replace(/\s/g, '');
            if (code.length !== 6) return alert("Enter a valid 6-digit code.");
            
            var connectBtn = document.getElementById('connectBtn');
            connectBtn.innerText = "Connecting...";
            connectBtn.disabled = true;

            document.getElementById('parentCodeDisplay').innerText = '••••••';
            isMuted = true;
            document.getElementById('muteIcon').innerText = "🔇";
            document.getElementById('volSlider').disabled = true;
            document.getElementById('volSlider').style.opacity = 0.5;

            document.getElementById('parentVideo').play().catch(function(){});
            
            initPeerNetwork('parent_' + Math.floor(Math.random()*10000), function() {
                var conn = peer.connect(code);
                
                conn.on('open', function() {
                    showScreen('parentScreen');
                    document.getElementById('disconnectOverlay').style.display = 'none';
                    
                    var call = peer.call(code, createEmptyAudioStream());
                    call.on('stream', function(remoteStream) {
                        initParentAudioNode(remoteStream);
                    });
                    
                    call.on('close', triggerDisconnect);
                    call.on('error', triggerDisconnect);
                });
                
                conn.on('data', function(data) {
                    if (data.type === 'HEARTBEAT') {
                        document.getElementById('cctvClock').innerText = "LIVE 🟢 " + data.time;
                    } else if (data.type === 'ERROR') {
                        alert(data.message);
                        endSession();
                    }
                });
                
                conn.on('close', triggerDisconnect);
                conn.on('error', triggerDisconnect);
                peer.on('disconnected', triggerDisconnect);
                peer.on('error', function(err) {
                    alert("Cannot find baby monitor. Ensure code is correct.");
                    endSession();
                });
            });
        }

        function initParentAudioNode(remoteStream) {
            var videoEl = document.getElementById('parentVideo');
            videoEl.srcObject = remoteStream;
            videoEl.volume = 0; 
            videoEl.play();
            
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            parentAudioCtx = new AudioContext();
            var source = parentAudioCtx.createMediaStreamSource(remoteStream);
            
            parentGainNode = parentAudioCtx.createGain();
            parentGainNode.gain.value = 0; 
            
            analyserNode = parentAudioCtx.createAnalyser();
            analyserNode.fftSize = 256;
            
            source.connect(analyserNode);
            source.connect(parentGainNode);
            parentGainNode.connect(parentAudioCtx.destination);
            
            drawVisualizer();
        }

        function initPeerNetwork(id, onSuccess) {
            var mode = document.getElementById('networkMode').value;
            var config = { debug: 2 };
            if (mode === 'lan') config.config = { 'iceServers': [] }; 
            
            peer = new Peer(id, config);
            peer.on('open', onSuccess);
            peer.on('error', function(err) {
                console.error(err);
                var connectBtn = document.getElementById('connectBtn');
                if(connectBtn) {
                    connectBtn.innerText = "Connect to Monitor";
                    connectBtn.disabled = false;
                }
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            var slider = document.getElementById('volSlider');
            if (isMuted) {
                if(parentGainNode) parentGainNode.gain.value = 0;
                document.getElementById('muteIcon').innerText = "🔇";
                slider.disabled = true;
                slider.style.opacity = 0.5;
            } else {
                if(parentGainNode) parentGainNode.gain.value = slider.value;
                document.getElementById('muteIcon').innerText = "🔊";
                slider.disabled = false;
                slider.style.opacity = 1;
            }
        }
        
        document.getElementById('volSlider').addEventListener('input', function(e) {
            if (!isMuted && parentGainNode) {
                parentGainNode.gain.value = e.target.value;
            }
        });

        // Parent Controls with 3.5s Cooldown Lock to Prevent Spam-Clicking
        function changeQuality() {
            if (isParentControlLocked) return;
            isParentControlLocked = true;
            document.getElementById('qualitySelect').style.opacity = 0.5;
            
            var q = document.getElementById('qualitySelect').value;
            broadcastCommand({ type: 'QUALITY', value: q });
            
            setTimeout(function() {
                isParentControlLocked = false;
                document.getElementById('qualitySelect').style.opacity = 1;
            }, 3500);
        }

        function remoteFlipCam() {
            if (isParentControlLocked) return;
            isParentControlLocked = true;
            var flipBtn = document.getElementById('flipBtn');
            flipBtn.disabled = true;
            
            broadcastCommand({ type: 'FLIP_CAM' });
            
            setTimeout(function() {
                isParentControlLocked = false;
                flipBtn.disabled = false;
            }, 3500);
        }
        
        // Baby-side command handler with isSwitchingCamera Concurrency Lock
        function handleParentCommand(data) {
            if (data.type === 'QUALITY') {
                if (isSwitchingCamera) return;
                isSwitchingCamera = true;
                startCameraHardware(data.value, function() {
                    isSwitchingCamera = false;
                });
            } else if (data.type === 'FLIP_CAM') {
                if (isSwitchingCamera) return;
                isSwitchingCamera = true;
                isCanvasActive = false; 
                setTimeout(function(){
                    currentCameraFacingMode = currentCameraFacingMode === "environment" ? "user" : "environment";
                    startCameraHardware('balanced', function() {
                        isSwitchingCamera = false;
                    });
                }, 500); 
            }
        }

        function broadcastCommand(data) {
            for (var i = 0; i < activeConnections.length; i++) {
                activeConnections[i].send(data);
            }
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(function() {
                var d = new Date();
                broadcastCommand({ type: 'HEARTBEAT', time: d.toLocaleTimeString() });
            }, 1000);
        }

        function drawVisualizer() {
            if (!analyserNode) return;
            requestAnimationFrame(drawVisualizer);
            var canvas = document.getElementById('audioVisualizer');
            var ctx = canvas.getContext('2d');
            var bufferLength = analyserNode.frequencyBinCount;
            var dataArray = new Uint8Array(bufferLength);
            analyserNode.getByteTimeDomainData(dataArray);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ff9500';
            ctx.beginPath();
            
            var sliceWidth = canvas.width * 1.0 / bufferLength;
            var x = 0;
            
            for(var i = 0; i < bufferLength; i++) {
                var v = dataArray[i] / 128.0;
                var y = v * canvas.height / 2;
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function toggleNightMode() {
            var video = document.getElementById('parentVideo');
            video.classList.toggle('night-mode');
        }

        function dimBabyScreen() {
            document.getElementById('dimOverlay').style.display = 'block';
        }
        function wakeBabyScreen() {
            document.getElementById('dimOverlay').style.display = 'none';
        }

        function toggleCodeMask() {
            var el = document.getElementById('parentCodeDisplay');
            var realCode = document.getElementById('joinRoomCode').value.toUpperCase();
            if (el.innerText === '••••••') el.innerText = realCode;
            else el.innerText = '••••••';
        }

        function createEmptyAudioStream() {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            var ctx = new AudioContext();
            var oscillator = ctx.createOscillator();
            var dst = oscillator.connect(ctx.createMediaStreamDestination());
            oscillator.start();
            return dst.stream;
        }

        function clearData() {
            if (confirm("Clear all saved devices, network modes, and room codes? This will completely reset the app.")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        function endSession() {
            var connectBtn = document.getElementById('connectBtn');
            if(connectBtn) {
                connectBtn.innerText = "Connect to Monitor";
                connectBtn.disabled = false;
            }

            cleanupOldStream();
            isCanvasActive = false;
            clearInterval(heartbeatInterval);
            if (peer) {
                peer.destroy();
                peer = null;
            }
            if (parentAudioCtx) {
                parentAudioCtx.close();
                parentAudioCtx = null;
            }
            activeConnections = [];
            activeCalls = [];
            document.getElementById('disconnectOverlay').style.display = 'none';
            showScreen('homeScreen');
        }
    </script>
</body>
</html>
