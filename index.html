<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Vaani Monitor</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        /* Global Reset & Box Sizing */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
        }

        /* Screen Management */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen.active {
            display: flex;
        }

        /* Home Screen */
        .home-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .app-title {
            font-size: 28px;
            color: #ff9800;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #ff9800;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-secondary {
            background-color: #333;
        }
        .input-box {
            width: 100%;
            padding: 15px;
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .warning-text {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
        }

        /* Video Containers */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translateZ(0); /* GPU Acceleration */
        }
        .baby-locked {
            pointer-events: none;
        }

        /* Overlays & UI Elements */
        .status-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .cctv-clock {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 9999;
            color: #ff9800;
            font-family: monospace;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .waveform-canvas {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 100px;
            height: 40px;
            z-index: 10;
        }

        /* Parent Controls */
        .parent-controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(18, 18, 18, 0.9);
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            z-index: 20;
        }
        .control-btn {
            background: #333;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
        }
        .control-dropdown {
            grid-column: span 2;
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 5px;
        }
        
        /* Blackout Overlay for Baby Device */
        #blackout-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 10000;
            opacity: 1;
        }

        /* Disconnect Overlay */
        #disconnect-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 5000;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="home-container">
            <h1 class="app-title">Baby Vaani</h1>
            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 14px; color: #ccc;">Connection Mode:</label>
                <select id="networkMode" class="input-box" style="margin-top: 5px;">
                    <option value="internet">Internet (Anywhere)</option>
                    <option value="lan">Local Wi-Fi (Same Router)</option>
                </select>
                <div class="warning-text">Choose the exact same mode as the baby cam</div>
            </div>

            <button class="btn" onclick="startBabyMode()">Start Baby Camera</button>
            
            <hr style="border-color: #333; margin: 20px 0;">

            <input type="text" id="joinCode" class="input-box" placeholder="ENTER 6-DIGIT CODE" maxlength="6">
            <button class="btn btn-secondary" onclick="startParentMode()">Connect as Parent</button>

            <button class="btn" style="background: transparent; color: #666; margin-top: 30px; font-size: 12px;" onclick="resetAppData()">Clear all app data & reset</button>
        </div>
    </div>

    <div id="baby-screen" class="screen">
        <div class="video-wrapper">
            <div class="status-overlay">Room Code: <span id="babyRoomCodeDisplay">••••••</span></div>
            <video id="babyVideoPreview" autoplay playsinline muted class="baby-locked"></video>
            
            <div style="position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 20;">
                <button class="control-btn" style="padding: 10px 20px; font-size: 16px;" onclick="toggleBabyScreenOff()">Baby Screen Off</button>
                <button class="control-btn" style="padding: 10px 20px; font-size: 16px; background: #d32f2f;" onclick="endSession()">End Stream</button>
            </div>
        </div>
        <div id="blackout-overlay" onclick="toggleBabyScreenOff()"></div>
    </div>

    <div id="parent-screen" class="screen">
        <div class="video-wrapper">
            <div class="status-overlay" id="connectionStrength">Signal: Connecting...</div>
            <video id="parentVideoFeed" autoplay playsinline></video>
            
            <div class="cctv-clock" id="cctvClock">LIVE 🟢 --:--:--</div>
            
            <canvas id="audioVisualizer" class="waveform-canvas"></canvas>

            <div id="disconnect-overlay">
                <h2>Connection Lost</h2>
                <p>Attempting to reconnect...</p>
            </div>

            <div class="parent-controls">
                <button class="control-btn" id="muteBtn" onclick="toggleParentMute()">Unmute</button>
                <button class="control-btn" onclick="toggleTalk()">Talk</button>
                <button class="control-btn" onclick="remoteFlipCamera()">Flip Cam</button>
                <button class="control-btn" onclick="remoteDimBabyScreen()">Dim Baby</button>
                
                <select id="qualitySelect" class="control-dropdown" onchange="changeQuality(this.value)">
                    <option value="balanced">HD Clear (720p • 24 FPS)</option>
                    <option value="fast">Standard (360p • 15 FPS)</option>
                    <option value="smooth">Fluid Motion (144p • 30 FPS)</option>
                    <option value="ultra">Max Battery Saver (144p • 10 FPS)</option>
                </select>
                
                <button class="control-btn" onclick="toggleNightMode()">Night</button>
                <button class="control-btn" style="background: #d32f2f;" onclick="endSession()">End</button>
            </div>
        </div>
    </div>

    <script>
        // --- GLOBAL ES5 VARIABLES ---
        var peer = null;
        var activeConnection = null;
        var activeCall = null;
        var localMediaStream = null;
        var proxyCanvas = document.createElement('canvas');
        var proxyCtx = proxyCanvas.getContext('2d');
        var animationFrameId = null;
        var clockInterval = null;
        var reconnectInterval = null;
        
        // Audio & Visualizer contexts
        var parentAudioCtx = null;
        var parentGainNode = null;
        var parentAnalyser = null;
        var isParentMuted = true;
        
        var isBabyScreenOff = false;
        var currentRole = null; // 'baby' or 'parent'
        var savedRoomCode = '';

        // --- UTILITIES ---
        function generateRoomCode() {
            var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // No O, 0, 1, I
            var code = '';
            for (var i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(function(el) {
                el.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function resetAppData() {
            if (confirm("Clear all saved devices, network modes, and room codes? This will completely reset the app.")) {
                try { localStorage.clear(); } catch(e) {}
                window.location.reload();
            }
        }

        // --- INITIALIZATION & PEERJS LOGIC ---
        function getPeerConfig() {
            var mode = document.getElementById('networkMode').value;
            if (mode === 'lan') {
                return { config: { 'iceServers': [] } }; // Force Local LAN
            }
            return { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } };
        }

        // --- BABY MODE LOGIC ---
        function startBabyMode() {
            currentRole = 'baby';
            var code = generateRoomCode();
            savedRoomCode = code;
            document.getElementById('babyRoomCodeDisplay').innerText = code;
            
            // Clean legacy caches
            try { localStorage.setItem('lastBabyCode', code); } catch(e) {}

            showScreen('baby-screen');

            // Boot hardware (ES5 Promises)
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' }, 
                audio: { noiseSuppression: false, autoGainControl: false } 
            }).then(function(stream) {
                localMediaStream = stream;
                document.getElementById('babyVideoPreview').srcObject = stream;
                
                // Start Canvas Proxy Loop (defaults to balanced)
                updateCanvasProxy('balanced');

                // Initialize PeerJS Server
                peer = new Peer(code, getPeerConfig());
                
                peer.on('connection', function(conn) {
                    activeConnection = conn;
                    setupBabyDataChannel(conn);
                });

                peer.on('call', function(call) {
                    activeCall = call;
                    // Answer with the Canvas Proxy Stream, NOT the raw camera hardware!
                    var proxyStream = proxyCanvas.captureStream(24);
                    // Append raw audio to the proxy stream
                    proxyStream.addTrack(localMediaStream.getAudioTracks()[0]);
                    
                    call.answer(proxyStream);
                    
                    call.on('stream', function(remoteStream) {
                        // 3X AUDIO BOOST FOR PARENT VOICE
                        if (remoteStream.getVideoTracks().length === 0 && remoteStream.getAudioTracks().length > 0) {
                            var babyAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            var source = babyAudioCtx.createMediaStreamSource(remoteStream);
                            var gainNode = babyAudioCtx.createGain();
                            gainNode.gain.value = 3.0; // Crank up parent's voice
                            source.connect(gainNode);
                            gainNode.connect(babyAudioCtx.destination);
                        }
                    });
                });
                
                // Start CCTV Heartbeat to parent
                setInterval(function() {
                    if(activeConnection && activeConnection.open) {
                        var now = new Date();
                        activeConnection.send({ type: 'heartbeat', time: now.toLocaleTimeString() });
                    }
                }, 1000);

            }).catch(function(err) {
                alert("Camera access denied or hardware locked. Please check permissions.");
                endSession();
            });
        }

        // --- CANVAS PROXY (Hardware Bypass for Old Devices) ---
        function updateCanvasProxy(qualityStr) {
            cancelAnimationFrame(animationFrameId);
            var v = document.getElementById('babyVideoPreview');
            
            var width, height, fps;
            if (qualityStr === 'ultra') { width = 256; height = 144; fps = 10; }
            else if (qualityStr === 'smooth') { width = 256; height = 144; fps = 30; }
            else if (qualityStr === 'fast') { width = 640; height = 360; fps = 15; }
            else { width = 1280; height = 720; fps = 24; } // balanced

            proxyCanvas.width = width;
            proxyCanvas.height = height;

            var lastDraw = 0;
            var interval = 1000 / fps;

            function drawLoop(timestamp) {
                if (timestamp - lastDraw >= interval) {
                    proxyCtx.drawImage(v, 0, 0, width, height);
                    lastDraw = timestamp;
                }
                animationFrameId = requestAnimationFrame(drawLoop);
            }
            animationFrameId = requestAnimationFrame(drawLoop);
        }

        // --- BABY CONTROLS ---
        function toggleBabyScreenOff() {
            isBabyScreenOff = !isBabyScreenOff;
            document.getElementById('blackout-overlay').style.display = isBabyScreenOff ? 'block' : 'none';
        }

        function setupBabyDataChannel(conn) {
            conn.on('data', function(data) {
                if (data.command === 'DIM_SCREEN') {
                    isBabyScreenOff = true;
                    document.getElementById('blackout-overlay').style.display = 'block';
                } else if (data.command === 'WAKE_SCREEN') {
                    isBabyScreenOff = false;
                    document.getElementById('blackout-overlay').style.display = 'none';
                } else if (data.command && data.command.indexOf('QUALITY:') === 0) {
                    var q = data.command.split(':')[1];
                    updateCanvasProxy(q); // Instantly scales software canvas
                }
            });
        }

        // --- PARENT MODE LOGIC ---
        function startParentMode() {
            var inputCode = document.getElementById('joinCode').value.trim().toUpperCase();
            if (inputCode.length !== 6) {
                alert("Please enter a valid 6-digit code.");
                return;
            }
            savedRoomCode = inputCode;
            currentRole = 'parent';
            showScreen('parent-screen');
            connectToBaby();
        }

        function connectToBaby() {
            // Clean up old connections if auto-reconnecting
            if (peer) { peer.destroy(); }
            
            peer = new Peer(getPeerConfig());
            
            peer.on('open', function() {
                // Establish Data Channel
                activeConnection = peer.connect(savedRoomCode);
                
                activeConnection.on('open', function() {
                    document.getElementById('connectionStrength').innerText = "Signal: Good 🟢";
                    document.getElementById('connectionStrength').style.color = "#4caf50";
                    
                    // Stop reconnect loop if it was running
                    if (reconnectInterval) {
                        clearInterval(reconnectInterval);
                        reconnectInterval = null;
                        document.getElementById('disconnect-overlay').style.display = 'none';
                    }
                });

                activeConnection.on('data', function(data) {
                    if (data.type === 'heartbeat') {
                        document.getElementById('cctvClock').innerText = "LIVE 🟢 " + data.time;
                    }
                });

                activeConnection.on('close', handleDisconnect);
                activeConnection.on('error', handleDisconnect);

                // Establish Video Call
                activeCall = peer.call(savedRoomCode, createSilentStream());
                
                activeCall.on('stream', function(remoteStream) {
                    setupParentAudioVisualizer(remoteStream);
                    var videoEl = document.getElementById('parentVideoFeed');
                    videoEl.srcObject = remoteStream;
                });
                
                activeCall.on('close', handleDisconnect);
                activeCall.on('error', handleDisconnect);
            });

            peer.on('error', function(err) {
                if (err.type === 'peer-unavailable') {
                    alert("Cannot find baby monitor. Please ensure it is active and the code is correct.");
                    endSession();
                } else {
                    handleDisconnect();
                }
            });
        }

        // --- SMART AUTO-RECONNECT ---
        function handleDisconnect() {
            if (currentRole !== 'parent') return;
            document.getElementById('connectionStrength').innerText = "Signal: Lost 🔴";
            document.getElementById('connectionStrength').style.color = "#d32f2f";
            document.getElementById('disconnect-overlay').style.display = 'flex';
            
            if (!reconnectInterval) {
                // Ping every 5 seconds
                reconnectInterval = setInterval(function() {
                    connectToBaby();
                }, 5000);
            }
        }

        // --- PARENT CONTROLS & WEB AUDIO ---
        function setupParentAudioVisualizer(stream) {
            if (!parentAudioCtx) {
                parentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            var source = parentAudioCtx.createMediaStreamSource(stream);
            parentGainNode = parentAudioCtx.createGain();
            parentAnalyser = parentAudioCtx.createAnalyser();
            
            // Start completely Muted
            parentGainNode.gain.value = 0;
            isParentMuted = true;
            document.getElementById('muteBtn').innerText = "Unmute";

            source.connect(parentGainNode);
            parentGainNode.connect(parentAnalyser);
            parentAnalyser.connect(parentAudioCtx.destination);
            
            // Draw Waveform
            var canvas = document.getElementById('audioVisualizer');
            var ctx = canvas.getContext('2d');
            parentAnalyser.fftSize = 256;
            var bufferLength = parentAnalyser.frequencyBinCount;
            var dataArray = new Uint8Array(bufferLength);

            function drawWave() {
                requestAnimationFrame(drawWave);
                parentAnalyser.getByteTimeDomainData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ff9800';
                ctx.beginPath();
                var sliceWidth = canvas.width * 1.0 / bufferLength;
                var x = 0;
                for (var i = 0; i < bufferLength; i++) {
                    var v = dataArray[i] / 128.0;
                    var y = v * canvas.height / 2;
                    if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }
            drawWave();
        }

        function toggleParentMute() {
            if (!parentGainNode) return;
            isParentMuted = !isParentMuted;
            parentGainNode.gain.value = isParentMuted ? 0 : 1.0;
            document.getElementById('muteBtn').innerText = isParentMuted ? "Unmute" : "Mute";
        }

        function toggleTalk() {
            // Maximize parent microphone sensitivity for Baby's 3x Amplifier
            navigator.mediaDevices.getUserMedia({
                video: false,
                audio: { autoGainControl: true, noiseSuppression: true, echoCancellation: true }
            }).then(function(micStream) {
                if (activeCall && activeCall.peerConnection) {
                    var sender = activeCall.peerConnection.getSenders().find(function(s) {
                        return s.track.kind === 'audio';
                    });
                    if (sender) {
                        sender.replaceTrack(micStream.getAudioTracks()[0]);
                        alert("Mic Live - Your voice is boosted on baby device.");
                    }
                }
            }).catch(function(e) {
                alert("Microphone permission required to talk.");
            });
        }

        function changeQuality(val) {
            if (activeConnection && activeConnection.open) {
                activeConnection.send({ command: 'QUALITY:' + val });
            }
        }

        function remoteDimBabyScreen() {
            if (activeConnection && activeConnection.open) {
                activeConnection.send({ command: 'DIM_SCREEN' });
            }
        }

        function toggleNightMode() {
            var v = document.getElementById('parentVideoFeed');
            if (v.style.filter.indexOf('brightness') !== -1) {
                v.style.filter = '';
            } else {
                v.style.filter = 'brightness(1.4) contrast(1.2) grayscale(0.2)';
            }
        }

        function endSession() {
            if (peer) { peer.destroy(); }
            if (reconnectInterval) { clearInterval(reconnectInterval); }
            if (localMediaStream) {
                localMediaStream.getTracks().forEach(function(t) { t.stop(); });
            }
            window.location.reload();
        }

        // Silent audio track to initialize 2-way call
        function createSilentStream() {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            var dest = ctx.createMediaStreamDestination();
            return dest.stream;
        }
    </script>
</body>
</html>
