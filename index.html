<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Vaani Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; color: #ffffff; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Home Screen Styling */
        .home-container { width: 90%; max-width: 450px; text-align: center; }
        .brand-title { font-weight: 800; font-size: 32px; color: #f6ad55; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .input-group { margin: 20px 0; width: 100%; }
        input[type="text"] { width: 100%; font-size: 22px; padding: 16px; text-align: center; border: 2px solid #444; background: #222; color: #fff; border-radius: 14px; outline: none; text-transform: uppercase; letter-spacing: 4px; }
        input[type="text"]:focus { border-color: #f6ad55; }
        
        select.control-dropdown { width: 100%; font-size: 14px; padding: 14px; background: #333; color: white; border: 1px solid #555; border-radius: 14px; outline: none; margin-bottom: 15px; }

        .network-mode-box { background: #222; border: 1px solid #444; border-radius: 16px; padding: 16px; margin-bottom: 20px; text-align: left; }
        .network-mode-box h4 { margin: 0 0 10px 0; color: #f6ad55; font-size: 14px; }
        .mode-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mode-option-btn { background: #333; border: 2px solid #444; border-radius: 12px; padding: 12px; color: #ccc; cursor: pointer; text-align: center; font-size: 13px; font-weight: bold; }
        .mode-option-btn.selected { background: #f6ad55; color: #000; border-color: #dd6b20; }

        .btn { width: 100%; background: #f6ad55; color: #000; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn-secondary { background: #333; color: #fff; }
        .btn:active { transform: scale(0.98); }

        /* Video & Monitor Screen */
        .monitor-container { position: relative; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        video.night-mode { filter: brightness(1.4) contrast(1.2) grayscale(0.2); }
        video.baby-locked { pointer-events: none; }
        
        .live-status-banner { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 8px; z-index: 20; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.live { background: #48bb78; animation: pulseLive 2s infinite; }
        .status-dot.waiting { background: #ecc94b; }
        .status-dot.offline { background: #f56565; }
        @keyframes pulseLive { 0% { box-shadow: 0 0 0 0 rgba(72,187,120,0.6); } 70% { box-shadow: 0 0 0 6px rgba(72,187,120,0); } 100% { box-shadow: 0 0 0 0 transparent; } }

        .ping-indicator, .battery-indicator { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 12px; font-size: 11px; margin-left: 8px; display: flex; align-items: center; gap: 4px; }
        .ping-indicator { color: #48bb78; }

        /* Controls */
        .controls-wrapper { position: absolute; bottom: 0; width: 100%; padding: 15px; background: rgba(0,0,0,0.85); z-index: 20; }
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .control-btn { background: #333; color: #fff; border: none; padding: 10px; font-size: 11px; font-weight: bold; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .control-btn.active-green { background: #48bb78; color: #000; }
        .control-btn.off { background: #555; color: #aaa; }
        .control-btn.night-active { background: #d69e2e; color: #000; }
        
        .slider-container { grid-column: span 2; display: flex; flex-direction: column; align-items: center; background: #333; padding: 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .slider-container input { width: 100%; margin-top: 5px; accent-color: #f6ad55; }

        /* Overlays */
        #dimOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; opacity: 0; display: none; transition: opacity 0.3s; }
        #dimOverlay.active { display: block; opacity: 1; pointer-events: auto; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
        
        /* Audio Visualizer */
        #audioVisualizer { position: absolute; bottom: 120px; right: 15px; width: 100px; height: 40px; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <div id="selectionScreen" class="screen active">
        <div class="home-container">
            <h1 class="brand-title"><span class="material-symbols-outlined" style="font-size: 40px;">child_care</span> Baby Vaani</h1>
            
            <div class="network-mode-box">
                <h4><span class="material-symbols-outlined">router</span> Connection Settings</h4>
                <div class="mode-options">
                    <div id="modeInternet" class="mode-option-btn selected" onclick="setNetworkMode('internet')">
                        <span class="material-symbols-outlined">public</span> Internet (Anywhere)
                    </div>
                    <div id="modeWifi" class="mode-option-btn" onclick="setNetworkMode('wifi')">
                        <span class="material-symbols-outlined">wifi</span> Local Wi-Fi (LAN)
                    </div>
                </div>
            </div>

            <button class="btn" onclick="startBabyMode()"><span class="material-symbols-outlined">videocam</span> Start Baby Camera</button>
            
            <hr style="border-color: #333; margin: 30px 0;">

            <div id="savedDevicesWrapper" style="display:none; margin-bottom: 10px;">
                <select id="savedDevicesSelect" class="control-dropdown" onchange="onSelectSavedDevice()"></select>
            </div>

            <div class="input-group">
                <input type="text" id="joinCode" placeholder="ENTER 6-DIGIT CODE" maxlength="6" oninput="onCustomCodeInput()">
            </div>
            
            <label style="display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; margin-bottom:15px; color:#aaa; cursor:pointer;">
                <input type="checkbox" id="rememberCodeCheck" checked style="width:16px; height:16px; accent-color:#f6ad55;"> Remember device
            </label>
            
            <button id="connectBtn" class="btn btn-secondary" onclick="initiateParentConnection()"><span class="material-symbols-outlined">link</span> Connect as Parent</button>

            <button style="background:transparent; color:#666; border:none; margin-top:20px; font-size:12px; cursor:pointer;" onclick="factoryResetApp()">Clear app data & reset</button>
        </div>
    </div>

    <div id="videoScreen" class="screen">
        <div class="monitor-container" id="monitorContainer">
            
            <div class="live-status-banner" id="liveStatusBanner">
                <div id="statusDot" class="status-dot offline"></div>
                <span id="liveStatusText">Offline</span>
                
                <div style="background:rgba(255,255,255,0.2); padding: 2px 8px; border-radius:10px; margin-left:10px; display:flex; align-items:center; gap:4px; cursor:pointer;" onclick="toggleCodeVisibility()">
                    <span id="activeCodeDisplay">••••••</span>
                    <span id="codeToggleIcon" class="material-symbols-outlined" style="font-size:14px;">visibility</span>
                </div>

                <div id="pingIndicator" class="ping-indicator" style="display:none;">
                    <span id="connIcon" class="material-symbols-outlined" style="font-size:14px;">signal_cellular_alt</span>
                    <span id="pingText">--ms</span>
                </div>
                <div id="remoteBattery" class="battery-indicator" style="display:none;">
                    <span class="material-symbols-outlined" style="font-size:14px;">battery_full</span>
                    <span id="battLevel">--%</span>
                </div>
            </div>

            <div id="disconnectOverlay" class="overlay" style="display:none;">
                <h2 style="color: #f56565; margin-bottom: 10px;">Connection Lost</h2>
                <p id="disconnectText" style="font-size: 16px; margin-bottom: 20px;">Reconnecting...</p>
                <button class="btn" style="background: #e53e3e; padding: 12px 24px; border-radius: 8px; color: white; border: none; cursor: pointer; max-width: 200px;" onclick="cancelReconnect()">Stop & Exit</button>
            </div>

            <video id="myCamera" playsinline autoplay></video>
            
            <video id="hiddenBabyCam" playsinline autoplay muted style="display:none;"></video>
            <canvas id="proxyCanvas" style="display:none;"></canvas>
            <canvas id="audioVisualizer"></canvas>
            <div id="babyAudioContainer"></div>

            <div id="dimOverlay"></div>

            <div id="babyControls" class="controls-wrapper" style="display:none;">
                <div style="margin-bottom:10px; text-align:center;">
                    <select id="cameraSelect" class="control-dropdown" onchange="switchCamera()" style="display:none; width:auto;"></select>
                </div>
                <div class="controls" style="grid-template-columns: repeat(2, 1fr);">
                    <button class="control-btn" onclick="wakeScreen()"><span class="material-symbols-outlined">light_mode</span> Wake Screen</button>
                    <button class="control-btn" style="background:#e53e3e;" onclick="goBack()"><span class="material-symbols-outlined">close</span> End Stream</button>
                </div>
            </div>

            <div id="parentControls" class="controls-wrapper" style="display:none;">
                
                <select id="qualitySelect" class="control-dropdown" onchange="requestQualityChange()">
                    <option value="balanced">HD Clear (720p • 24 FPS)</option>
                    <option value="fast">Standard (360p • 15 FPS)</option>
                    <option value="ultra_high_fps">Fluid Motion (144p • 30 FPS)</option>
                    <option value="ultra">Max Battery Saver (144p • 10 FPS)</option>
                </select>

                <div class="controls">
                    <button id="micBtn" class="control-btn" onclick="toggleParentListening()"><span class="material-symbols-outlined">volume_off</span> Unmute</button>
                    <button id="talkBtn" class="control-btn off" onclick="toggleTalk()"><span class="material-symbols-outlined">mic</span> Talk</button>
                    <button id="nightModeBtn" class="control-btn off" onclick="toggleNightMode()"><span class="material-symbols-outlined">nightlight</span> Night</button>
                    <button id="camBtn" class="control-btn" onclick="toggleRemoteVideo()"><span class="material-symbols-outlined">videocam_off</span> Vid Off</button>
                    
                    <button id="flipCamBtn" class="control-btn" onclick="requestCameraSwitch()"><span class="material-symbols-outlined">flip_camera_ios</span> Flip Cam</button>
                    <button id="remoteDimBtn" class="control-btn off" onclick="toggleRemoteDim()"><span class="material-symbols-outlined">mode_night</span> Screen Off</button>
                    <button id="powerBtn" class="control-btn" onclick="toggleRemotePower()"><span class="material-symbols-outlined">power_settings_new</span> Sleep</button>
                    <button class="control-btn" style="background:#e53e3e;" onclick="goBack()"><span class="material-symbols-outlined">close</span> End</button>
                    
                    <div class="slider-container">
                        Parent Volume (Boost <span id="boostVal">1.0</span>x)
                        <input type="range" id="audioBoostSlider" min="0" max="5" step="0.1" value="1" disabled style="opacity:0.5" oninput="updateAudioBoost()">
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        function getSavedItem(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
        function setSavedItem(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
        function removeSavedItem(key) { try { localStorage.removeItem(key); } catch(e) {} }

        var videoBox = document.getElementById('myCamera');
        var hiddenVideo = document.getElementById('hiddenBabyCam');
        var proxyCanvas = document.getElementById('proxyCanvas');
        var proxyCtx = proxyCanvas ? proxyCanvas.getContext('2d', { alpha: false }) : null;
        var canvasInterval = null;
        
        var rawStream = null, activeStream = null, parentLocalStream = null, peer = null, currentCall = null, wakeLock = null;
        var activeCalls = [], dataConnections = [];
        
        var batteryInterval = null, pingInterval = null, tickInterval = null;
        var parentAudioCtx = null, parentAudioSource = null, parentAnalyser = null, parentGainNode = null;
        var parentIsMuted = true;
        
        var visualizerCtx = null, visualizerCanvas = null, visualizerAnimationFrame = null;
        var currentRotation = 0, activeRoomCode = "", isBaby = false, isNightMode = false, isCodeVisible = false;
        var selectedNetworkMode = 'internet', currentQuality = 'ultra', isRemoteDimmed = false, reconnectAttempts = 0;
        
        var parentHeartbeatInterval = null;
        var lastHeartbeatReceived = 0;
        var networkFallbackAttempted = false;
        
        // AUTO RECONNECT TIMEOUT VARIABLE
        var reconnectTimeout = null;

        // UI Interactions
        window.addEventListener('popstate', function(event) { teardownConnections(); showScreen('selectionScreen', true); });
        
        function initNetworkMode() { setNetworkMode(getSavedItem('babyVaani_netMode') || 'internet', false); }
        function setNetworkMode(mode, save) {
            if (save === undefined) save = true;
            selectedNetworkMode = mode;
            if (save) setSavedItem('babyVaani_netMode', mode);
            
            var btnInt = document.getElementById('modeInternet');
            var btnWifi = document.getElementById('modeWifi');
            if (mode === 'wifi') {
                if (btnWifi) btnWifi.className = 'mode-option-btn selected';
                if (btnInt) btnInt.className = 'mode-option-btn';
            } else {
                if (btnInt) btnInt.className = 'mode-option-btn selected';
                if (btnWifi) btnWifi.className = 'mode-option-btn';
            }
        }
        initNetworkMode();

        function factoryResetApp() {
            if (confirm("Clear all saved devices, network modes, and room codes? This will completely reset the app.")) {
                removeSavedItem('babyVaani_netMode'); removeSavedItem('babyVaani_roomCode'); removeSavedItem('babyVaani_parentCode'); removeSavedItem('babyVaani_savedDevices');
                window.location.reload();
            }
        }

        function getPeerConfig() {
            return selectedNetworkMode === 'wifi' 
                ? { config: { iceServers: [] } } 
                : { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
        }

        function getSavedParentDevices() {
            try { var data = getSavedItem('babyVaani_savedDevices'); return data ? JSON.parse(data) : []; } catch(e) { return []; }
        }
        function saveParentDevice(code) {
            if (!code || code.length !== 6) return;
            var list = getSavedParentDevices();
            if (list.indexOf(code) === -1) {
                list.unshift(code);
                if (list.length > 10) list.pop();
                setSavedItem('babyVaani_savedDevices', JSON.stringify(list));
            }
        }
        function populateSavedDevicesDropdown() {
            var list = getSavedParentDevices();
            var wrapper = document.getElementById('savedDevicesWrapper');
            var select = document.getElementById('savedDevicesSelect');
            if (list.length === 0) { wrapper.style.display = 'none'; return; }
            wrapper.style.display = 'block';
            select.innerHTML = '<option value="">-- Select a saved device --</option>';
            for (var i = 0; i < list.length; i++) {
                var opt = document.createElement('option');
                opt.value = list[i]; opt.text = "Device Code: " + list[i];
                select.appendChild(opt);
            }
        }
        function onSelectSavedDevice() {
            var select = document.getElementById('savedDevicesSelect');
            if (select.value) document.getElementById('joinCode').value = select.value;
        }
        function onCustomCodeInput() {
            var input = document.getElementById('joinCode');
            input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            document.getElementById('savedDevicesSelect').value = "";
        }
        function toggleCodeVisibility() {
            isCodeVisible = !isCodeVisible;
            document.getElementById('activeCodeDisplay').innerText = isCodeVisible ? activeRoomCode : '••••••';
            document.getElementById('codeToggleIcon').innerText = isCodeVisible ? 'visibility_off' : 'visibility';
        }
        function setLiveStatus(mode, text) {
            var banner = document.getElementById('liveStatusBanner');
            if (!mode) { banner.style.display = 'none'; return; }
            banner.style.display = 'flex';
            document.getElementById('liveStatusText').innerText = text;
            document.getElementById('statusDot').className = 'status-dot ' + mode;
        }

        // HARDWARE & CAMERA LOGIC
        function wakeScreen() {
            var dim = document.getElementById('dimOverlay');
            if(dim) dim.classList.remove('active');
        }
        var dimOverlayEl = document.getElementById('dimOverlay');
        if(dimOverlayEl) { dimOverlayEl.addEventListener('touchstart', function(e) { e.preventDefault(); wakeScreen(); }, {passive: false}); }

        function startBatteryTracking() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(battery) {
                    function updateBattery() {
                        var level = Math.round(battery.level * 100);
                        for (var i = 0; i < dataConnections.length; i++) {
                            if (dataConnections[i].open) dataConnections[i].send("BAT:" + level + ":" + battery.charging);
                        }
                    }
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                    batteryInterval = setInterval(updateBattery, 60000);
                }).catch(function(e) {});
            } else {
                function sendUnsupported() {
                    for (var i = 0; i < dataConnections.length; i++) { if (dataConnections[i].open) dataConnections[i].send("BAT:UNSUPPORTED"); }
                }
                sendUnsupported(); batteryInterval = setInterval(sendUnsupported, 60000);
            }
        }

        function startPingTracking() {
            pingInterval = setInterval(function() {
                if (currentCall && currentCall.peerConnection) {
                    var pc = currentCall.peerConnection;
                    if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                        document.getElementById('connIcon').innerText = 'signal_cellular_connected_no_internet_0_bar';
                        document.getElementById('connIcon').style.color = '#f56565';
                        document.getElementById('pingText').innerText = 'Offline';
                        handleParentDisconnect();
                        return;
                    }
                    if (pc.getStats) {
                        pc.getStats().then(function(stats) {
                            var pingFound = false;
                            stats.forEach(function(report) {
                                if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime !== undefined) {
                                    pingFound = true;
                                    var rtt = Math.round(report.currentRoundTripTime * 1000);
                                    document.getElementById('pingText').innerText = rtt + 'ms';
                                    var icon = document.getElementById('connIcon');
                                    if (rtt < 150) { icon.innerText = 'signal_cellular_alt'; icon.style.color = '#48bb78'; } 
                                    else if (rtt < 400) { icon.innerText = 'signal_cellular_alt_2_bar'; icon.style.color = '#ecc94b'; } 
                                    else { icon.innerText = 'signal_cellular_alt_1_bar'; icon.style.color = '#f56565'; }
                                }
                            });
                        }).catch(function(e) {});
                    }
                }
            }, 3000);
        }

        function setCanvasQuality(quality) {
            if (!isBaby || !proxyCanvas || !proxyCtx) return;
            var w = 1280, h = 720, fps = 20;
            if (quality === 'ultra') { w = 256; h = 144; fps = 10; } 
            else if (quality === 'ultra_high_fps') { w = 256; h = 144; fps = 30; } 
            else if (quality === 'fast') { w = 426; h = 240; fps = 15; }
            
            if (window.innerHeight > window.innerWidth) { var temp = w; w = h; h = temp; }
            proxyCanvas.width = w; proxyCanvas.height = h;

            if (canvasInterval) clearInterval(canvasInterval);
            var ms = Math.floor(1000 / fps);
            canvasInterval = setInterval(function() {
                var vTrack = rawStream ? rawStream.getVideoTracks()[0] : null;
                if (vTrack && !vTrack.enabled) {
                    proxyCtx.fillStyle = '#000000'; proxyCtx.fillRect(0, 0, proxyCanvas.width, proxyCanvas.height);
                    proxyCtx.fillStyle = "#f6ad55"; proxyCtx.fillText("CAMERA OFF", 15, proxyCanvas.height / 2);
                } else if (hiddenVideo && hiddenVideo.readyState >= 2) {
                    proxyCtx.clearRect(0, 0, proxyCanvas.width, proxyCanvas.height);
                    proxyCtx.drawImage(hiddenVideo, 0, 0, proxyCanvas.width, proxyCanvas.height);
                }
            }, ms);

            // Throttle Bitrate natively based on Code 4 architecture
            for (var i = 0; i < activeCalls.length; i++) {
                var c = activeCalls[i];
                if (c.call && c.call.peerConnection) {
                    var senders = c.call.peerConnection.getSenders();
                    var videoSender = null;
                    for (var j = 0; j < senders.length; j++) { if (senders[j].track && senders[j].track.kind === 'video') videoSender = senders[j]; }
                    if (videoSender) {
                        try {
                            if (videoSender.getParameters) {
                                var params = videoSender.getParameters();
                                if (params.encodings && params.encodings.length > 0) {
                                    if (quality === 'ultra') params.encodings[0].maxBitrate = 80000;
                                    else if (quality === 'ultra_high_fps') params.encodings[0].maxBitrate = 150000;
                                    else if (quality === 'fast') params.encodings[0].maxBitrate = 200000;
                                    else delete params.encodings[0].maxBitrate;
                                    if (videoSender.setParameters) videoSender.setParameters(params).catch(function(e){});
                                }
                            }
                        } catch (e) {}
                    }
                }
            }
        }

        function buildProxyStream() {
            if (!isBaby || !proxyCanvas || typeof proxyCanvas.captureStream !== 'function') { activeStream = rawStream; return; }
            if (!activeStream || activeStream.getTracks().length === 0) { activeStream = proxyCanvas.captureStream(30); }
            var oldAudio = activeStream.getAudioTracks();
            for (var i = 0; i < oldAudio.length; i++) { activeStream.removeTrack(oldAudio[i]); }
            if (rawStream && rawStream.getAudioTracks().length > 0) { activeStream.addTrack(rawStream.getAudioTracks()[0]); }
            setCanvasQuality(currentQuality);
        }

        function populateCameras() {
            var select = document.getElementById('cameraSelect');
            if(!select) return;
            select.innerHTML = '';
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
                navigator.mediaDevices.enumerateDevices().then(function(devices) {
                    var videoDevices = [];
                    for (var i = 0; i < devices.length; i++) { if (devices[i].kind === 'videoinput') videoDevices.push(devices[i]); }
                    var activeDeviceId = null;
                    if (rawStream && rawStream.getVideoTracks().length > 0) {
                        var track = rawStream.getVideoTracks()[0];
                        if (track.getSettings) { var settings = track.getSettings(); if (settings && settings.deviceId) activeDeviceId = settings.deviceId; }
                    }
                    for (var j = 0; j < videoDevices.length; j++) {
                        var option = document.createElement('option');
                        option.value = videoDevices[j].deviceId; option.text = "Camera " + (j + 1);
                        if (videoDevices[j].deviceId === activeDeviceId) option.selected = true;
                        select.appendChild(option);
                    }
                    if (videoDevices.length > 0) select.style.display = "inline-block";
                }).catch(function(e) {});
            } catch (err) {}
        }

        function wakeBabyDevice(callback) {
            if (!isBaby) return;
            wakeScreen();
            if (rawStream && activeStream) { if (callback) callback(activeStream); return; }
            setLiveStatus('waiting', 'Waking Camera...');
            var select = document.getElementById('cameraSelect');
            var deviceId = select ? select.value : null;
            var constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "environment" }, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } };
            if (deviceId) { constraints.video.deviceId = { exact: deviceId }; }

            navigator.mediaDevices.getUserMedia(constraints).then(function(newStream) {
                rawStream = newStream;
                if(hiddenVideo) { hiddenVideo.srcObject = rawStream; hiddenVideo.play().catch(function(e){}); }
                buildProxyStream();
                if(videoBox) { videoBox.srcObject = rawStream; videoBox.muted = true; videoBox.play().catch(function(e){}); }
                setLiveStatus('waiting', 'Camera Ready');
                
                var newVideoTrack = rawStream.getVideoTracks()[0];
                var newAudioTrack = rawStream.getAudioTracks().length > 0 ? rawStream.getAudioTracks()[0] : null;
                
                for (var i = 0; i < activeCalls.length; i++) {
                    var c = activeCalls[i];
                    if (c.call && c.call.peerConnection) {
                        var senders = c.call.peerConnection.getSenders();
                        for (var j = 0; j < senders.length; j++) {
                            if (senders[j].track) {
                                if (senders[j].track.kind === 'video' && (!proxyCanvas || typeof proxyCanvas.captureStream !== 'function')) {
                                    if (senders[j].replaceTrack) senders[j].replaceTrack(newVideoTrack).catch(function(e){});
                                }
                                if (senders[j].track.kind === 'audio' && newAudioTrack) {
                                    if (senders[j].replaceTrack) senders[j].replaceTrack(newAudioTrack).catch(function(e){});
                                }
                            }
                        }
                    }
                }
                if (callback) callback(activeStream);
            }).catch(function(err) { setLiveStatus('offline', 'Camera Error'); if (callback) callback(null); });
        }

        function switchCamera() {
            if (window.cameraSwitchingLock) return;
            window.cameraSwitchingLock = true;
            var select = document.getElementById('cameraSelect');
            var deviceId = select ? select.value : null;
            var constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } };
            if (deviceId) { constraints.video.deviceId = { exact: deviceId }; }

            try {
                if (rawStream) { var tracks = rawStream.getTracks(); for (var t = 0; t < tracks.length; t++) tracks[t].stop(); }
                setTimeout(function() {
                    navigator.mediaDevices.getUserMedia(constraints).then(function(newStream) {
                        rawStream = newStream;
                        if(hiddenVideo) { hiddenVideo.srcObject = rawStream; hiddenVideo.play().catch(function(e){}); }
                        var newVideoTrack = rawStream.getVideoTracks()[0];
                        var newAudioTrack = rawStream.getAudioTracks().length > 0 ? rawStream.getAudioTracks()[0] : null;
                        if(videoBox) { videoBox.srcObject = rawStream; videoBox.play().catch(function(e){}); }
                        
                        if (!proxyCanvas || typeof proxyCanvas.captureStream !== 'function') { activeStream = rawStream; } 
                        else {
                            if (activeStream && activeStream.getAudioTracks().length > 0) { activeStream.removeTrack(activeStream.getAudioTracks()[0]); }
                            if (newAudioTrack) { activeStream.addTrack(newAudioTrack); }
                        }
                        
                        for (var i = 0; i < activeCalls.length; i++) {
                            var c = activeCalls[i];
                            if (c.call && c.call.peerConnection) {
                                var senders = c.call.peerConnection.getSenders();
                                for (var j = 0; j < senders.length; j++) {
                                    if (senders[j].track) {
                                        if (senders[j].track.kind === 'video' && (!proxyCanvas || typeof proxyCanvas.captureStream !== 'function')) {
                                            if (senders[j].replaceTrack) senders[j].replaceTrack(newVideoTrack).catch(function(e){});
                                        }
                                        if (senders[j].track.kind === 'audio' && newAudioTrack) {
                                            if (senders[j].replaceTrack) senders[j].replaceTrack(newAudioTrack).catch(function(e){});
                                        }
                                    }
                                }
                            }
                        }
                        setTimeout(function() { window.cameraSwitchingLock = false; }, 1000);
                    }).catch(function(err) { window.cameraSwitchingLock = false; });
                }, 600);
            } catch (err) { window.cameraSwitchingLock = false; }
        }

        function showScreen(screenId, isBackwards) {
            var screens = document.querySelectorAll('.screen');
            for (var i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
            var target = document.getElementById(screenId);
            if(target) target.classList.add('active');
            if (!isBackwards && screenId !== 'selectionScreen') { history.pushState({ screen: screenId }, ""); }
        }

        // PEER JS LOGIC
        function initBabyPeer(forceNew) {
            if (forceNew === undefined) forceNew = false;
            var code = getSavedItem('babyVaani_roomCode');
            if (forceNew || !code || code.length !== 6) {
                var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; code = "";
                for(var i = 0; i < 6; i++) { code += chars.charAt(Math.floor(Math.random() * chars.length)); }
                setSavedItem('babyVaani_roomCode', code);
            }
            activeRoomCode = code;
            document.getElementById('activeCodeDisplay').innerText = code;
            
            if (peer) peer.destroy();
            var isolatedPeerId = "BV-" + selectedNetworkMode.toUpperCase() + "-" + activeRoomCode;
            peer = new Peer(isolatedPeerId, getPeerConfig());
            
            peer.on('error', function(err) { if (err.type === 'unavailable-id') { initBabyPeer(true); } });

            peer.on('connection', function(conn) {
                dataConnections.push(conn);
                conn.on('data', function(data) { handleDataChannelMessage(data, conn); });
                conn.on('close', function() { cleanUpParent(conn.peer); });

                wakeBabyDevice(function(stream) {
                    if (!stream) return;
                    var call = peer.call(conn.peer, stream);
                    if (call) {
                        try {
                            var checkPC = setInterval(function() {
                                if (!call) return clearInterval(checkPC);
                                if (call.peerConnection) {
                                    clearInterval(checkPC);
                                    call.peerConnection.addEventListener('iceconnectionstatechange', function() {
                                        var state = call.peerConnection.iceConnectionState;
                                        if (state === 'disconnected' || state === 'failed' || state === 'closed') { cleanUpParent(conn.peer); }
                                    });
                                }
                            }, 500);
                        } catch(e) {}
                    }
                    
                    var parentAudioEl = document.createElement('audio');
                    parentAudioEl.autoplay = true; parentAudioEl.playsInline = true; parentAudioEl.id = "audio-" + conn.peer;
                    var audioCont = document.getElementById('babyAudioContainer');
                    if(audioCont) audioCont.appendChild(parentAudioEl);
                    
                    activeCalls.push({ peerId: conn.peer, call: call });
                    setCanvasQuality(currentQuality);

                    call.on('stream', function(parentStream) {
                        // 3X AUDIO BOOST FOR PARENT VOICE
                        try {
                            var babyAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            var source = babyAudioCtx.createMediaStreamSource(parentStream);
                            var gainNode = babyAudioCtx.createGain();
                            gainNode.gain.value = 3.0; // Boost volume to 300%
                            source.connect(gainNode);
                            gainNode.connect(babyAudioCtx.destination);
                        } catch(e) {
                            // Fallback if browser strictly blocks AudioContext here
                            if(parentAudioEl) {
                                parentAudioEl.srcObject = parentStream;
                                parentAudioEl.play().catch(function(e){});
                            }
                        }
                    });
                    
                    call.on('close', function() { cleanUpParent(conn.peer); });
                });
            });
        }

        function cleanUpParent(peerId) {
            var newDataConn = []; for (var i = 0; i < dataConnections.length; i++) { if (dataConnections[i].peer !== peerId) newDataConn.push(dataConnections[i]); }
            dataConnections = newDataConn;
            var newActiveCalls = []; for (var j = 0; j < activeCalls.length; j++) { if (activeCalls[j].peerId !== peerId) newActiveCalls.push(activeCalls[j]); }
            activeCalls = newActiveCalls;

            var audioEl = document.getElementById("audio-" + peerId);
            if (audioEl) { audioEl.srcObject = null; audioEl.remove(); }
            
            if (isBaby && activeCalls.length === 0) {
                if (rawStream) { rawStream.getVideoTracks().forEach(t => t.enabled = false); rawStream.getAudioTracks().forEach(t => t.enabled = false); }
                setLiveStatus('waiting', 'Standby (Sleeping)');
                var dim = document.getElementById('dimOverlay');
                if (dim) dim.classList.add('active');
            }
        }

        function startBabyMode() {
            try {
                isBaby = true;
                showScreen('videoScreen');

                document.getElementById('parentControls').style.display = "none";
                
                if(videoBox) { videoBox.classList.add('baby-locked'); }

                wakeBabyDevice(function(stream) {
                    populateCameras();
                    if(navigator.mediaDevices.ondevicechange !== undefined) { navigator.mediaDevices.ondevicechange = populateCameras; }
                    startBatteryTracking();
                    tickInterval = setInterval(function() {
                        if (!isBaby) return;
                        for(var i=0; i<dataConnections.length; i++) { if(dataConnections[i].open) dataConnections[i].send("PING"); }

        function startParentMode() {
            try {
                isBaby = false;

                var savedCode = getSavedItem('babyVaani_parentCode');

                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {

        function initiateParentConnection() {
            var joinInp = document.getElementById('joinCode');
            if(!joinInp) return;
            var targetCode = joinInp.value.toUpperCase().trim();
            if (targetCode.length !== 6) return;
            
            var connectBtn = document.getElementById('connectBtn');
            if (connectBtn) { connectBtn.disabled = true; connectBtn.innerHTML = 'Connecting...'; }

            if (!parentAudioCtx) { parentAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (parentAudioCtx.state === 'suspended') parentAudioCtx.resume();
            
            var remCheck = document.getElementById('rememberCodeCheck');
            if (remCheck && remCheck.checked) { setSavedItem('babyVaani_parentCode', targetCode); saveParentDevice(targetCode); }
            
            activeRoomCode = targetCode;
            networkFallbackAttempted = false;
            executePeerConnection(targetCode, false);
        }

        function executePeerConnection(targetCode, isFallback) {
            if (peer) peer.destroy();
            peer = new Peer(getPeerConfig());
            showScreen('videoScreen');
            setLiveStatus('waiting', isFallback ? 'Auto-Switching...' : 'Connecting...');

            peer.on('open', function(id) {
                var targetIsolatedId = "BV-" + selectedNetworkMode.toUpperCase() + "-" + targetCode;
                var conn = peer.connect(targetIsolatedId);
                dataConnections.push(conn);
                conn.on('data', function(data) { handleDataChannelMessage(data, conn); });
            });

            peer.on('call', function(call) {
                currentCall = call;
                call.answer(parentLocalStream || null);

                try {
                    var checkPC = setInterval(function() {
                        if (!currentCall) return clearInterval(checkPC);
                        if (call.peerConnection) {
                            clearInterval(checkPC);
                            call.peerConnection.addEventListener('iceconnectionstatechange', function() {
                                var state = call.peerConnection.iceConnectionState;
                                if (state === 'disconnected' || state === 'failed' || state === 'closed') { handleParentDisconnect(); }
                            });
                        }
                    }, 500);
                } catch(e) {}

                call.on('stream', function(remoteStream) {
                    reconnectAttempts = 0; networkFallbackAttempted = false;
                    var disc = document.getElementById('disconnectOverlay');
                    if(disc) disc.style.display = 'none';
                    if (reconnectTimeout) { clearTimeout(reconnectTimeout); reconnectTimeout = null; }
                    
                    setLiveStatus('live', 'Live - Monitoring');
                    lastHeartbeatReceived = Date.now();
                    
                    if(parentHeartbeatInterval) clearInterval(parentHeartbeatInterval);
                    parentHeartbeatInterval = setInterval(function() {
                        if (!isBaby && currentCall) {
                            if (Date.now() - lastHeartbeatReceived > 4000) { clearInterval(parentHeartbeatInterval); handleParentDisconnect(); }
                        }
                    }, 2000);

                    document.getElementById('activeCodeDisplay').innerText = isCodeVisible ? activeRoomCode : '••••••';
                    document.getElementById('parentControls').style.display = "block";
                    document.getElementById('babyControls').style.display = "none";
                    document.getElementById('pingIndicator').style.display = "flex";

                    if(videoBox) { videoBox.muted = true; videoBox.srcObject = remoteStream; videoBox.play().catch(function(e){}); }

                    parentIsMuted = true;
                    var slider = document.getElementById('audioBoostSlider');
                    if(slider) { slider.disabled = true; slider.style.opacity = '0.5'; }
                    var micBtn = document.getElementById('micBtn');
                    if(micBtn) { micBtn.innerHTML = '<span class="material-symbols-outlined">volume_off</span> Unmute'; micBtn.className = 'control-btn'; }

                    try {
                        if (parentAudioSource) parentAudioSource.disconnect();
                        parentAudioSource = parentAudioCtx.createMediaStreamSource(remoteStream);
                        parentAnalyser = parentAudioCtx.createAnalyser();
                        parentGainNode = parentAudioCtx.createGain();
                        parentAnalyser.fftSize = 256;
                        parentGainNode.gain.value = 0;
                        parentAudioSource.connect(parentAnalyser);
                        parentAnalyser.connect(parentGainNode);
                        parentGainNode.connect(parentAudioCtx.destination);
                        
                        visualizerCanvas = document.getElementById('audioVisualizer');
                        if(visualizerCanvas) {
                            visualizerCtx = visualizerCanvas.getContext('2d');
                            visualizerCanvas.width = visualizerCanvas.offsetWidth;
                            visualizerCanvas.height = visualizerCanvas.offsetHeight;
                            if (visualizerAnimationFrame) cancelAnimationFrame(visualizerAnimationFrame);
                            drawWaveform();
                        }
                    } catch (e) {}
                    startPingTracking();
                });
                
                call.on('close', function() { handleParentDisconnect(); });
            });

            peer.on('error', function(err) {
                if (err.type === 'peer-unavailable' && !networkFallbackAttempted) {
                    networkFallbackAttempted = true;
                    selectedNetworkMode = (selectedNetworkMode === 'wifi') ? 'internet' : 'wifi';
                    setTimeout(function() { executePeerConnection(targetCode, true); }, 1000);
                } else { handleParentDisconnect(); }
            });
        }

        // SMART RECONNECT ESCAPE HATCH

            reconnectAttempts++;
            var discText = document.getElementById('disconnectText');
            if(discText) discText.innerText = "Reconnecting (Attempt " + reconnectAttempts + ")...";
            
            if (reconnectTimeout) clearTimeout(reconnectTimeout);

        function drawWaveform() {
            if (!visualizerCtx || !visualizerCanvas) return;
            visualizerAnimationFrame = requestAnimationFrame(drawWaveform);
            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            if (!parentAnalyser || parentIsMuted) {
                visualizerCtx.beginPath();
                visualizerCtx.moveTo(0, visualizerCanvas.height / 2);
                visualizerCtx.lineTo(visualizerCanvas.width, visualizerCanvas.height / 2);
                visualizerCtx.lineWidth = 2; visualizerCtx.strokeStyle = 'rgba(246, 173, 85, 0.3)';
                visualizerCtx.stroke();
                return;
            }
            var bufferLength = parentAnalyser.frequencyBinCount;
            var dataArray = new Uint8Array(bufferLength);
            parentAnalyser.getByteTimeDomainData(dataArray);
            visualizerCtx.lineWidth = 2; visualizerCtx.strokeStyle = '#f6ad55';
            visualizerCtx.beginPath();
            var sliceWidth = visualizerCanvas.width * 1.0 / bufferLength;
            var x = 0;
            for (var i = 0; i < bufferLength; i++) {
                var v = dataArray[i] / 128.0; var y = v * (visualizerCanvas.height / 2);
                if (i === 0) { visualizerCtx.moveTo(x, y); } else { visualizerCtx.lineTo(x, y); }
                x += sliceWidth;
            }
            visualizerCtx.lineTo(visualizerCanvas.width, visualizerCanvas.height / 2);
            visualizerCtx.stroke();
        }

        function handleDataChannelMessage(data, conn) {
            if (typeof data !== 'string') return;
            if (data === 'PING') { lastHeartbeatReceived = Date.now(); return; }
            if (data === 'SWITCH_CAM') {
                if (isBaby) {
                    var select = document.getElementById('cameraSelect');
                    if (select && select.options.length > 1) {
                        select.selectedIndex = (select.selectedIndex + 1) % select.options.length;
                        switchCamera();
                    }
                }
            }
            else if (data === 'VIDEO_OFF') { if (isBaby && rawStream) { rawStream.getVideoTracks().forEach(t => t.enabled = false); } }
            else if (data === 'VIDEO_ON') { if (isBaby && rawStream) { rawStream.getVideoTracks().forEach(t => t.enabled = true); } }
            else if (data === 'SLEEP_CAM') {
                if (isBaby && rawStream) {
                    var tracks = rawStream.getTracks(); for (var t = 0; t < tracks.length; t++) tracks[t].stop();
                    rawStream = null; activeStream = null;
                    if (canvasInterval) clearInterval(canvasInterval);
                    setLiveStatus('waiting', 'Standby (Sleeping)');
                }
            }
            else if (data === 'WAKE_CAM') { if (isBaby && !rawStream) { wakeBabyDevice(); } }
            else if (data === 'DIM_SCREEN') { if (isBaby) { var d = document.getElementById('dimOverlay'); if(d) d.classList.add('active'); } }
            else if (data === 'WAKE_SCREEN') { if (isBaby) { var d = document.getElementById('dimOverlay'); if(d) d.classList.remove('active'); } }
            else if (data === 'DISCONNECT') {
                if (isBaby && conn && conn.peer) { cleanUpParent(conn.peer); }
                else if (!isBaby) { cancelReconnect(); /* ESCAPE HATCH: Baby ended session, stop looping */ }
            }
            else if (data.indexOf('BAT:') === 0) {
                var battUI = document.getElementById('remoteBattery');
                if(!battUI) return;
                battUI.style.display = 'flex';
                var bLvl = document.getElementById('battLevel');
                var icn = battUI.querySelector('.material-symbols-outlined');
                
                if (data === 'BAT:UNSUPPORTED') {
                    if(bLvl) bLvl.innerText = 'iOS';
                    if(icn) { icn.innerText = 'battery_unknown'; icn.style.color = '#a0aec0'; }
                    return;
                }
                var parts = data.split(':'); var level = parseInt(parts[1]); var isCharging = parts[2] === 'true';
                if(bLvl) bLvl.innerText = level + '%';
                if(icn) {
                    icn.innerText = isCharging ? 'battery_charging_full' : 'battery_full';
                    icn.style.color = level <= 20 ? '#f56565' : '#48bb78';
                }
            }
            else if (data.indexOf('QUALITY:') === 0) {
                if(isBaby) { currentQuality = data.split(':')[1]; setCanvasQuality(currentQuality); }
            }
        }

        function teardownConnections() {
            for(var i=0; i<dataConnections.length; i++) { if(dataConnections[i].open) dataConnections[i].send('DISCONNECT'); }
            clearInterval(batteryInterval); clearInterval(pingInterval); clearInterval(tickInterval);
            if (canvasInterval) clearInterval(canvasInterval);
            if (visualizerAnimationFrame) cancelAnimationFrame(visualizerAnimationFrame);
            if (parentHeartbeatInterval) clearInterval(parentHeartbeatInterval);
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            
            reconnectAttempts = 0; networkFallbackAttempted = false;
            var connectBtn = document.getElementById('connectBtn');
            if (connectBtn) { connectBtn.disabled = false; connectBtn.innerHTML = '<span class="material-symbols-outlined">link</span> Connect as Parent'; }
            
            if (rawStream) { var tracks = rawStream.getTracks(); for(var t=0; t<tracks.length; t++) tracks[t].stop(); }
            if (parentLocalStream) { var pTracks = parentLocalStream.getTracks(); for(var pt=0; pt<pTracks.length; pt++) pTracks[pt].stop(); }
            if (peer) peer.destroy();
            
            rawStream = activeStream = parentLocalStream = peer = currentCall = null;
            activeCalls = []; dataConnections = [];
            
            document.getElementById('remoteBattery').style.display = 'none';
            document.getElementById('pingIndicator').style.display = 'none';
            document.getElementById('disconnectOverlay').style.display = 'none';
            
            var bAud = document.getElementById('audio-' + activeRoomCode);
            if(bAud) { bAud.srcObject = null; bAud.remove(); }
            if(videoBox) videoBox.srcObject = null;
            if(hiddenVideo) hiddenVideo.srcObject = null;
        }

        function goBack() {
            try { teardownConnections(); showScreen('selectionScreen', true); if (history.state && history.state.screen) { history.back(); } } 
            catch(e) { showScreen('selectionScreen', true); }
        }
    </script>
</body>
</html>
